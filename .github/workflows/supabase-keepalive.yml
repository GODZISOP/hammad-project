name: Supabase Keep-Alive Cron

on:
  schedule:
    # Runs daily at 00:00 UTC to ensure Supabase never sleeps/pauses
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database to Prevent Inactivity Pause
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://mlobidzdaxvxlnhgoidf.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_gGMfPnbl5qk65Sn46C8dqA_wcJXKy0Q' }}
        run: |
          echo "Sending keep-alive ping to Supabase..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/categories?select=id&limit=1")
          echo "Supabase HTTP status: ${STATUS}"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Keep-alive ping failed with HTTP ${STATUS}"
            exit 1
          fi
          echo "Keep-alive ping successful. Supabase database is active."
